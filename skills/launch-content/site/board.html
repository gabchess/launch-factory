<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch desk, $company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Tokens. Keep in sync with design-spec.md. */
  :root {
    --paper: #E9F0E0;        /* ledger green, the page */
    --sheet: #F5F9F0;        /* the grid */
    --slip: #FFFDF2;         /* the draft slip */
    --rule: #B7CAAD;         /* ledger ruling */
    --ink: #1B2925;          /* text */
    --soft: #4B5C54;         /* secondary text */
    --red: #A8392D;          /* margin rule, SENT BACK, ASK, quote numbers, removed words */
    --blue: #24449A;         /* IN REVIEW */
    --green: #1F6638;        /* APPROVED, added words */
    --grey: #5C6861;         /* SKIP, the next columns */
    --mark: #FFF3A6;         /* highlighter on the selected cell and its draft */
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --typed: "Courier Prime", "Courier New", monospace;  /* only for text copied from a source */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --cols: 300px repeat(4, minmax(0, 1fr));
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; }
  a { color: inherit; }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
  ol, ul { list-style: none; }

  .page { max-width: 1440px; margin: 0 auto; padding: 20px 40px 56px; }

  /* Masthead */
  .mast { display: flex; justify-content: space-between; align-items: baseline; gap: 16px 32px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  .mast-name { display: flex; align-items: baseline; gap: 14px; }
  .co { font-weight: 500; }
  .mast h1 { font-size: 21px; font-weight: 800; font-stretch: 68%; letter-spacing: 0.01em; padding-left: 14px; border-left: 1px solid var(--ink); }
  .mode { font-size: 14px; color: var(--soft); }

  /* The headline number */
  .clock { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px 48px; flex-wrap: wrap; padding: 22px 0 24px; border-bottom: 3px double var(--ink); }
  .took { display: flex; align-items: flex-end; gap: 24px; }
  .took-n { font-size: 132px; font-weight: 800; font-stretch: 62%; line-height: 0.78; letter-spacing: -0.02em; white-space: nowrap; }
  .took-n small { font-size: 0.5em; font-weight: 700; margin-left: 0.06em; letter-spacing: 0; }
  .took-what { font-size: 27px; font-weight: 700; font-stretch: 75%; line-height: 1.12; max-width: 28ch; }
  .week { font-size: 14.5px; color: var(--soft); text-align: right; }
  .week b { color: var(--ink); font-weight: 700; }

  /* The grid: Sources down, outputs across, and the next columns beside it */
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 20px; align-items: stretch; padding-top: 26px; }
  .grid { background: var(--sheet); border: 1px solid var(--ink); }
  .heads, .src { display: grid; grid-template-columns: var(--cols); }
  .heads { border-bottom: 1px solid var(--ink); }
  .heads > * { padding: 12px 12px 11px; }
  .heads > * + * { border-left: 1px solid var(--rule); }
  .sandbox { align-self: end; font-size: 13.5px; line-height: 1.3; color: var(--soft); max-width: 24ch; }
  .gate-name { display: block; font-size: 21px; font-weight: 800; font-stretch: 68%; letter-spacing: 0.01em; line-height: 1.1; }
  .owner { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 14.5px; font-weight: 600; line-height: 1.2; }
  .owner svg { width: 15px; height: 15px; flex: none; }

  .src { border-bottom: 1px solid var(--rule); min-height: 68px; }
  .rows > li:last-child { border-bottom: 0; }
  .src-what { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; }
  .src-time { align-self: stretch; display: flex; align-items: center; padding-left: 12px; border-right: 3px double var(--red); font-family: var(--typed); font-size: 14px; line-height: 1.2; color: var(--soft); }
  .src-body { padding: 9px 12px 9px 14px; min-width: 0; }
  .src-title { display: block; font-size: 17px; font-weight: 700; line-height: 1.22; }
  .kind { display: block; margin-top: 2px; font-size: 13.5px; color: var(--soft); }
  .kind::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border: 1.5px solid currentColor; transform: translateY(-1px); }
  .kind.is-brief::before { border-radius: 50%; background: currentColor; }
  .is-quiet { min-height: 52px; }
  .is-quiet .src-title { font-weight: 500; color: var(--soft); }

  /* A cell: one output for one Source. A stamp and one number. */
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-left: 1px solid var(--rule); text-decoration: none; text-align: center; }
  .cell-gate { display: none; }
  .cell-n { font-size: 13.5px; line-height: 1.2; color: var(--soft); white-space: nowrap; }
  .cell-n b { font-size: 18px; font-weight: 800; font-stretch: 75%; color: var(--ink); }
  .cell.is-selected { background: var(--mark); box-shadow: inset 0 0 0 2px var(--ink); }
  .span { grid-column: 2 / -1; flex-direction: row; justify-content: flex-start; gap: 14px; padding-left: 22px; text-align: left; }
  .span .cell-n { font-size: 15px; white-space: normal; }
  .is-ask .span .cell-n { color: var(--ink); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) {
    a.cell:not(.is-selected):hover { background: var(--slip); }
  }

  /* Stamps. Shape carries the state as well as colour. */
  .stamp { display: inline-block; padding: 5px 9px 4px; border: 2px solid currentColor; border-radius: 4px; font-family: var(--ui); font-stretch: 66%; font-weight: 800; font-size: 16px; line-height: 1; letter-spacing: 0.08em; text-indent: 0.08em; white-space: nowrap; transform: rotate(-2deg); }
  .stamp.review { color: var(--blue); background: rgba(36, 68, 154, 0.08); }
  .stamp.back { color: var(--red); border-style: dashed; transform: rotate(2deg); }
  .stamp.ok { color: var(--sheet); background: var(--green); border-color: var(--green); transform: rotate(-1deg); }
  .stamp.skip { color: var(--grey); border-width: 1.5px; font-size: 14px; font-weight: 700; transform: rotate(1.5deg); }
  .stamp.ask { color: var(--red); border-style: double; border-width: 5px; padding: 3px 9px 2px; transform: rotate(-3deg); }
  .src:nth-child(even) .stamp.review { transform: rotate(1.2deg); }

  /* Next: outputs that are planned and not built */
  .next { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px dashed var(--grey); color: var(--grey); }
  .next .next-h { position: absolute; top: -12px; left: 10px; padding: 0 7px; line-height: 1.4; background: var(--paper); font-size: 15px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.04em; }
  .next li { padding: 14px 10px 12px; }
  .next li + li + li { border-left: 1.5px dashed var(--rule); }
  .next .gate-name { font-size: 18px; }
  .next-add { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.2; }

  /* The selected draft, and one approved example */
  .out { display: grid; grid-template-columns: minmax(0, 59fr) minmax(0, 41fr); gap: 32px; align-items: start; padding-top: 30px; }
  .slip { background: var(--slip); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--rule); }
  .slip-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 14px 24px 13px; border-bottom: 1px solid var(--ink); }
  .is-open .slip-head { background: var(--mark); }
  .slip-head h2 { flex: 1 1 auto; font-size: 21px; font-weight: 800; font-stretch: 68%; letter-spacing: 0.01em; line-height: 1.15; }
  .slip-head h2 span { font-weight: 500; font-stretch: 100%; font-size: 16px; letter-spacing: 0; margin-left: 8px; }
  .slip-head .owner { margin-top: 0; }

  .line { display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr); column-gap: 14px; align-items: start; padding: 14px 24px 13px; border-bottom: 1px solid var(--rule); }
  .line-copy { font-size: 19px; font-weight: 500; line-height: 1.3; }
  .is-title .line-copy { font-size: 27px; font-weight: 800; font-stretch: 68%; line-height: 1.08; }
  .line-id { font-family: var(--typed); font-weight: 700; font-size: 15px; line-height: 1.5; color: var(--red); text-align: center; border: 1.5px solid currentColor; border-radius: 3px; margin-top: 1px; }
  .line-quote { font-family: var(--typed); font-size: 15.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .line-where { margin-top: 4px; font-size: 13.5px; color: var(--soft); }
  .more > summary { padding: 11px 24px; border-bottom: 1px solid var(--rule); font-size: 15px; font-weight: 600; color: var(--soft); cursor: pointer; }
  .more[open] > summary { color: var(--ink); }

  .ban { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; padding: 12px 24px; border-bottom: 1px solid var(--ink); font-size: 15px; }
  .ban h3 { font-size: 15px; font-weight: 800; }
  .ban ul { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .ban li { font-family: var(--typed); font-size: 15px; padding: 0 7px; border: 1px dashed var(--red); border-radius: 3px; color: var(--red); }
  .ban p { color: var(--green); font-weight: 700; }

  .slip-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; padding: 16px 24px 20px; }
  .fine { font-size: 14.5px; color: var(--soft); }
  .btn { display: inline-block; background: var(--ink); color: var(--slip); text-decoration: none; font-weight: 700; font-stretch: 75%; font-size: 22px; letter-spacing: 0.01em; padding: 15px 30px 14px; border-radius: 3px; white-space: nowrap; transition: transform 140ms var(--ease-out), background-color 140ms ease; }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--blue); } }

  /* Approved: what the owner kept, and what the owner changed */
  .is-done .slip-head { background: var(--sheet); }
  .kept { display: flex; align-items: flex-end; gap: 14px; padding: 20px 24px 16px; border-bottom: 1px solid var(--rule); }
  .kept-n { font-size: 68px; font-weight: 800; font-stretch: 62%; line-height: 0.8; letter-spacing: -0.01em; color: var(--green); }
  .kept-what { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .diff { padding: 16px 24px 22px; font-size: 19px; font-weight: 500; line-height: 1.5; }
  .diff p + p { margin-top: 5px; }
  .diff del { color: var(--red); background: rgba(168, 57, 45, 0.1); text-decoration-thickness: 2px; padding: 0 3px; border-radius: 2px; }
  .diff ins { color: var(--green); background: rgba(31, 102, 56, 0.13); text-decoration: none; font-weight: 700; padding: 0 3px; border-radius: 2px; }

  /* 1100 wide */
  @media (max-width: 1279px) {
    :root { --cols: 236px repeat(4, minmax(0, 1fr)); }
    .page { padding: 18px 24px 48px; }
    .took-n { font-size: 112px; }
    .board { grid-template-columns: minmax(0, 1fr) 264px; gap: 16px; }
    .src-what { grid-template-columns: 58px minmax(0, 1fr); }
    .src-time { padding-left: 8px; font-size: 13px; }
    .src-body { padding-left: 10px; padding-right: 8px; }
    .src-title { font-size: 16px; }
    .stamp { font-size: 15px; padding: 5px 7px 4px; }
    .cell-n { font-size: 13px; }
    .gate-name { font-size: 19px; }
    .owner { font-size: 13.5px; }
    .next .gate-name { font-size: 17px; }
    .out { gap: 24px; }
    .line { grid-template-columns: 30px minmax(0, 1fr); grid-template-areas: "copy copy" "id quote"; row-gap: 8px; }
    .line-copy { grid-area: copy; }
    .line-id { grid-area: id; }
    .line-src { grid-area: quote; }
    .slip-head, .line, .ban, .slip-foot, .kept, .diff, .more > summary { padding-left: 20px; padding-right: 20px; }
  }

  /* Phone: each Source becomes a card, nothing scrolls sideways */
  @media (max-width: 820px) {
    .page { padding: 14px 16px 40px; }
    .mast h1 { font-size: 19px; }
    .clock { padding: 18px 0; }
    .took { flex-wrap: wrap; gap: 12px 20px; }
    .took-n { font-size: 96px; }
    .took-what { font-size: 23px; }
    .week { text-align: left; }
    .board { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 20px; }
    .heads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .heads > * { padding: 10px 12px; border-left: 0; }
    .heads > :nth-child(odd):not(.sandbox) { border-left: 1px solid var(--rule); }
    .sandbox { grid-column: 1 / -1; max-width: none; border-bottom: 1px solid var(--rule); }
    .src { grid-template-columns: repeat(2, minmax(0, 1fr)); min-height: 0; border-bottom: 1px solid var(--ink); }
    .src-what { grid-column: 1 / -1; grid-template-columns: 58px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
    .cell { align-items: flex-start; text-align: left; padding: 10px 12px 12px; border-left: 0; border-bottom: 1px solid var(--rule); }
    .cell-gate { display: block; font-size: 14px; font-weight: 700; }
    .cell.is-empty { display: none; }
    .span { grid-column: 1 / -1; align-items: center; padding-left: 12px; border-bottom: 0; }
    .next li { padding: 14px 8px 12px; }
    .out { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 24px; }
    .slip { box-shadow: none; }
    .slip-head, .line, .ban, .slip-foot, .kept, .diff, .more > summary { padding-left: 16px; padding-right: 16px; }
    .is-title .line-copy { font-size: 24px; }
    .line { column-gap: 10px; }
    .line-quote { font-size: 15px; }
    .slip-foot { flex-direction: column; align-items: stretch; }
    .btn { text-align: center; }
    .kept-n { font-size: 60px; }
  }
  /* Added by the site builder: the round and owner under a stamp, the Check's failing line, the ask questions, the roadmap owner. */
  .cell .cell-n { white-space: normal; }
  .cell-who { font-size: 12.5px; line-height: 1.2; color: var(--soft); }
  .cell-held { font-size: 12.5px; line-height: 1.25; color: var(--red); max-width: 24ch; overflow-wrap: anywhere; }
  .span .cell-text { display: flex; flex-direction: column; gap: 4px; }
  .asks { display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .next-owner { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.2; }
</style>
</head>
<body>
<div class="page">

  <header class="mast">
    <div class="mast-name">
      <span class="co">$company</span>
      <h1>Launch desk</h1>
    </div>
    <p class="mode">$mode</p>
  </header>

$clock

  <main>
    <div class="board">

      <section class="grid" aria-label="Drafts by source and by output">
        <div class="heads">
          <p class="sandbox">In this sandbox one person plays every owner.</p>
$heads
        </div>

        <ol class="rows">
$rows
        </ol>
      </section>

      <ol class="next" data-key="next" aria-label="Next outputs, not built yet">
        <li class="next-h" aria-hidden="true">Next</li>
$nexts
      </ol>

    </div>

    <div class="out">
$slip
    </div>
  </main>
</div>
</body>
</html>
