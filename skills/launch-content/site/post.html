<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title, $company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Same tokens as board.html. The post is the slip after it left the desk. */
  :root {
    --paper: #E9F0E0;
    --sheet: #F5F9F0;
    --slip: #FFFDF2;
    --rule: #B7CAAD;
    --ink: #1B2925;
    --soft: #4B5C54;
    --red: #A8392D;
    --blue: #24449A;
    --green: #1F6638;
    --mark: #FFF3A6;
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --typed: "Courier Prime", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--slip); color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.5; }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
  a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  h1, h2, p, ol { margin: 0; padding: 0; }
  ol { list-style: none; }

  .top { border-bottom: 1px solid var(--ink); background: var(--paper); }
  .top-in { max-width: 1120px; margin: 0 auto; padding: 16px 40px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .co { font-weight: 800; font-stretch: 68%; font-size: 21px; letter-spacing: 0.01em; text-decoration: none; }
  .top nav { display: flex; gap: 22px; font-size: 15px; }
  .top nav a[aria-current] { font-weight: 700; }

  .post { max-width: 1120px; margin: 0 auto; padding: 56px 40px 72px; display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); column-gap: 56px; align-items: start; }
  .meta { grid-column: 1 / -1; font-size: 15px; color: var(--soft); }
  .meta b { color: var(--ink); font-weight: 700; }
  h1 { grid-column: 1 / -1; margin-top: 10px; font-size: 92px; font-weight: 800; font-stretch: 62%; line-height: 0.92; letter-spacing: -0.015em; padding-bottom: 28px; border-bottom: 3px double var(--ink); }

  .body { padding-top: 32px; }
  .body p { font-size: 24px; line-height: 1.4; font-weight: 500; }
  .body p + p { margin-top: 16px; }
  .ref { font-family: var(--typed); font-size: 0.62em; font-weight: 700; color: var(--red); text-decoration: none; vertical-align: 0.5em; margin-left: 3px; padding: 1px 5px; border: 1.5px solid currentColor; border-radius: 3px; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .ref:hover { background: var(--red); color: var(--slip); border-color: var(--red); } }

  .via { grid-column: 1 / -1; order: 3; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--soft); }
  .via b { color: var(--ink); font-weight: 700; }
  .via-ok { padding: 4px 8px 3px; border-radius: 4px; background: var(--green); color: var(--sheet); font-weight: 800; font-stretch: 66%; font-size: 14px; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; transform: rotate(-1deg); }
  .via-also { margin-left: auto; font-size: 13.5px; }
  .how { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 15px; color: var(--soft); max-width: 56ch; }

  .sources { margin-top: 32px; background: var(--sheet); border: 1px solid var(--ink); }
  .sources h2 { padding: 12px 18px 10px; font-size: 21px; font-weight: 800; font-stretch: 68%; letter-spacing: 0.01em; border-bottom: 1px solid var(--ink); }
  .src { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 12px; padding: 14px 18px 13px; border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
  .src:last-child { border-bottom: 0; }
  .src:target { background: var(--mark); }
  .src-id { font-family: var(--typed); font-weight: 700; font-size: 16px; line-height: 1.5; color: var(--red); text-align: center; border: 1.5px solid currentColor; border-radius: 3px; align-self: start; margin-top: 1px; }
  .src-quote { font-family: var(--typed); font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
  .src-where { margin-top: 5px; font-size: 14.5px; color: var(--soft); }
  .src-where a { color: var(--blue); font-weight: 700; }

  .foot { border-top: 1px solid var(--ink); }
  .foot-in { max-width: 1120px; margin: 0 auto; padding: 16px 40px 32px; font-size: 14.5px; color: var(--soft); }

  @media (max-width: 960px) {
    .post { grid-template-columns: minmax(0, 1fr); padding: 40px 24px 56px; }
    .top-in, .foot-in { padding-left: 24px; padding-right: 24px; }
    h1 { font-size: 72px; }
    .sources { margin-top: 40px; }
  }
  @media (max-width: 520px) {
    .via-also { margin-left: 0; }
    .post { padding: 28px 16px 40px; }
    .top-in, .foot-in { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 54px; padding-bottom: 20px; }
    .body { padding-top: 24px; }
    .body p { font-size: 21px; }
    .src { padding-left: 14px; padding-right: 12px; column-gap: 10px; }
    .src-quote { font-size: 15px; }
  }
  /* Added by the site builder: the changelog, FAQ and social pages share the post sheet. */
  .entries > li + li { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--rule); }
  .entry-when { font-size: 15px; color: var(--soft); }
  .entries h2 { margin-top: 4px; font-size: 32px; font-weight: 800; font-stretch: 68%; line-height: 1.05; }
  .entries .body { padding-top: 12px; }
  .entries .body p { font-size: 21px; }
  .card { background: var(--sheet); border: 1px solid var(--ink); padding: 18px 20px; }
  .card .body { padding-top: 10px; }
  .copy { margin-top: 14px; font-family: var(--ui); font-weight: 700; font-stretch: 75%; font-size: 18px; padding: 10px 22px 9px; border: 0; border-radius: 3px; background: var(--ink); color: var(--slip); cursor: pointer; }
  .copy:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) { .copy:hover { background: var(--blue); } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="co" href="${root}index.html">$company</a>
    <nav aria-label="Site">
$nav
    </nav>
  </div>
</header>

<main class="post">
$main
</main>

<footer class="foot">
  <div class="foot-in">$company is a sample company.</div>
</footer>
$script
</body>
</html>
